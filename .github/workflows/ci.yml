name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: atlas_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Check formatting
        working-directory: backend
        run: uv run ruff format --check .
      - name: Lint
        working-directory: backend
        run: uv run ruff check .
      - name: Type check
        working-directory: backend
        run: uv run mypy
      - name: Migrate PostgreSQL integration database
        working-directory: backend
        env:
          ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
        run: uv run alembic upgrade head
      - name: Verify latest migration round trip
        working-directory: backend
        env:
          ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
        run: >-
          uv run alembic downgrade 20260816_0134 &&
          uv run alembic upgrade head
      - name: Prepare time-bounded PostgreSQL integration database
        working-directory: backend
        env:
          ATLAS_DATABASE_URL: >-
            postgresql+psycopg://atlas:atlas@localhost:5432/atlas_process_creation_test
        run: |
          uv run python -c "import psycopg; connection = psycopg.connect('postgresql://atlas:atlas@localhost:5432/postgres', autocommit=True); connection.execute('CREATE DATABASE atlas_process_creation_test'); connection.close()"
          uv run alembic upgrade head
      - name: Prepare downstream PostgreSQL integration database
        working-directory: backend
        env:
          ATLAS_DATABASE_URL: >-
            postgresql+psycopg://atlas:atlas@localhost:5432/atlas_downstream_test
        run: |
          uv run python -c "import psycopg; connection = psycopg.connect('postgresql://atlas:atlas@localhost:5432/postgres', autocommit=True); connection.execute('CREATE DATABASE atlas_downstream_test'); connection.close()"
          uv run alembic upgrade head
      - name: Prepare review-request PostgreSQL integration database
        working-directory: backend
        env:
          ATLAS_DATABASE_URL: >-
            postgresql+psycopg://atlas:atlas@localhost:5432/atlas_review_request_test
        run: |
          uv run python -c "import psycopg; connection = psycopg.connect('postgresql://atlas:atlas@localhost:5432/postgres', autocommit=True); connection.execute('CREATE DATABASE atlas_review_request_test'); connection.close()"
          uv run alembic upgrade head
      - name: Prepare reviewer-assignment PostgreSQL integration database
        working-directory: backend
        env:
          ATLAS_DATABASE_URL: >-
            postgresql+psycopg://atlas:atlas@localhost:5432/atlas_reviewer_assignment_test
        run: |
          uv run python -c "import psycopg; connection = psycopg.connect('postgresql://atlas:atlas@localhost:5432/postgres', autocommit=True); connection.execute('CREATE DATABASE atlas_reviewer_assignment_test'); connection.close()"
          uv run alembic upgrade head
      - name: Test time-bounded process creation consumption
        working-directory: backend
        env:
          ATLAS_TEST_POSTGRES_DSN: >-
            postgresql+psycopg://atlas:atlas@localhost:5432/atlas_process_creation_test
        run: >-
          uv run pytest -q
          tests/test_workflow_protected_runtime_process_creation_consumptions_postgres.py
          -k live_postgres
      - name: Test foundation PostgreSQL integration
        working-directory: backend
        env:
          ATLAS_TEST_POSTGRES_DSN: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
        run: >-
          uv run pytest -q
          tests/test_workflow_physical_transport_route_bindings_postgres.py
          tests/test_workflow_transport_credential_assignment_snapshots_postgres.py
          tests/test_workflow_transport_credential_assignment_bindings_postgres.py
          tests/test_workflow_transport_credential_assignment_freshness_admissions_postgres.py
          tests/test_workflow_credential_access_authorization_leases_postgres.py
          tests/test_workflow_endpoint_materializations_postgres.py
          tests/test_workflow_credential_materializations_postgres.py
          tests/test_workflow_target_context_bindings_postgres.py
          tests/test_workflow_target_context_access_authorization_leases_postgres.py
          tests/test_workflow_target_context_artifact_openings_postgres.py
          tests/test_workflow_target_context_capsule_consumer_bindings_postgres.py
          tests/test_workflow_target_context_capsule_handoff_authorization_leases_postgres.py
          tests/test_workflow_target_context_capsule_handoffs_postgres.py
          tests/test_workflow_target_context_capsule_opening_authorization_leases_postgres.py
          tests/test_workflow_target_context_capsule_openings_postgres.py
          tests/test_workflow_protected_resident_context_access_authorizations_postgres.py
          tests/test_workflow_protected_resident_context_access_consumptions_postgres.py
          tests/test_workflow_protected_runtime_context_injection_authorizations_postgres.py
          tests/test_workflow_protected_runtime_context_injection_consumptions_postgres.py
          tests/test_workflow_protected_runtime_context_use_authorizations_postgres.py
          tests/test_workflow_protected_runtime_context_use_authorization_consumptions_postgres.py
          tests/test_workflow_protected_runtime_context_uses_postgres.py
          tests/test_workflow_protected_runtime_start_authorizations_postgres.py
          tests/test_workflow_protected_runtime_start_consumption_postgres.py
          tests/test_workflow_protected_runtime_readiness_authorizations_postgres.py
          tests/test_workflow_protected_runtime_readiness_consumptions_postgres.py
          tests/test_workflow_protected_runtime_process_creation_authorizations_postgres.py
          tests/test_bundled_connector_operator_state_postgres.py
          -k live_postgres
      - name: Test downstream PostgreSQL integration
        working-directory: backend
        env:
          ATLAS_TEST_POSTGRES_DSN: >-
            postgresql+psycopg://atlas:atlas@localhost:5432/atlas_downstream_test
        run: >-
          uv run pytest -q
          tests/test_workflow_protected_runtime_process_scheduling_consumptions_postgres.py
          tests/test_workflow_protected_runtime_process_scheduling_authorizations_postgres.py
          tests/test_workflow_protected_runtime_process_resume_authorizations_postgres.py
          tests/test_bounded_invocation.py
          tests/test_invocation_evidence.py
          -k live_postgres
      - name: Test review-request PostgreSQL integration
        working-directory: backend
        env:
          ATLAS_TEST_POSTGRES_DSN: >-
            postgresql+psycopg://atlas:atlas@localhost:5432/atlas_review_request_test
        run: >-
          uv run pytest -q
          tests/test_draft_review_request.py
          -k live_postgres
      - name: Test reviewer-assignment PostgreSQL integration
        working-directory: backend
        env:
          ATLAS_TEST_POSTGRES_DSN: >-
            postgresql+psycopg://atlas:atlas@localhost:5432/atlas_reviewer_assignment_test
        run: >-
          uv run pytest -q
          tests/test_reviewer_assignment.py
          -k live_postgres
      - name: Test
        working-directory: backend
        run: uv run pytest -n 4 --dist loadfile --max-worker-restart=0

  frontend:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: "11.7.0"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Type check
        working-directory: frontend
        run: pnpm typecheck
      - name: Test
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        run: pnpm build
