name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: atlas_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Check formatting
        working-directory: backend
        run: uv run ruff format --check .
      - name: Lint
        working-directory: backend
        run: uv run ruff check .
      - name: Type check
        working-directory: backend
        run: uv run mypy
      - name: Migrate PostgreSQL integration database
        working-directory: backend
        env:
          ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
        run: uv run alembic upgrade head
      - name: Verify latest migration round trip
        working-directory: backend
        env:
          ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
        run: >-
          uv run alembic downgrade 20260815_0130 &&
          uv run alembic upgrade head
      - name: Test PostgreSQL integration
        working-directory: backend
        env:
          ATLAS_TEST_POSTGRES_DSN: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
        run: >-
          uv run pytest -q
          tests/test_workflow_physical_transport_route_bindings_postgres.py
          tests/test_workflow_transport_credential_assignment_snapshots_postgres.py
          tests/test_workflow_transport_credential_assignment_bindings_postgres.py
          tests/test_workflow_transport_credential_assignment_freshness_admissions_postgres.py
          tests/test_workflow_credential_access_authorization_leases_postgres.py
          tests/test_workflow_endpoint_materializations_postgres.py
          tests/test_workflow_credential_materializations_postgres.py
          tests/test_workflow_target_context_bindings_postgres.py
          -k live_postgres
      - name: Test
        working-directory: backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: "11.7.0"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Type check
        working-directory: frontend
        run: pnpm typecheck
      - name: Test
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        run: pnpm build
